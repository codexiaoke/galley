# 用 Docker 运行 Galley。
#
# 1. 在同一个目录下建一个 .env 文件，写上后台密码（至少 12 位）：
#      GALLEY_ADMIN_PASSWORD=换成你自己的密码
# 2. 启动：docker compose up -d --build
# 3. 打开 http://localhost:3000 ，后台在 /admin
#
# 数据（数据库和上传的图片）在 galley-data 这个卷里，升级镜像不会丢。
# 对外提供服务时，请在前面放一个带 HTTPS 的反向代理（Caddy、Nginx 等）。

services:
  galley:
    build: .
    image: galley:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 后台管理员密码，至少 12 位。不设置时后台不可用。
      GALLEY_ADMIN_PASSWORD: ${GALLEY_ADMIN_PASSWORD:?请在 .env 文件里设置 GALLEY_ADMIN_PASSWORD}
    volumes:
      - galley-data:/data

volumes:
  galley-data:
