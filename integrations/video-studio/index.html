<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galley 视频工坊</title>
    <style>
      :root {
        --bg: #f7f6f3;
        --panel: #ffffff;
        --ink: #23201c;
        --soft: #6b655c;
        --faint: #9a9388;
        --rule: #e4e0d8;
        --accent: #a63d2a;
        --good: #3d7558;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--rule);
        background: var(--panel);
      }
      header h1 {
        margin: 0 8px 0 0;
        font-size: 15px;
        font-weight: 600;
      }
      header .site {
        font-size: 12px;
        color: var(--faint);
      }
      /* 选文章的下拉：一个按钮，点开是一个清单 */
      .picker {
        position: relative;
      }
      .pick {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: min(420px, 56vw);
        text-align: left;
      }
      .pick span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pick svg {
        flex: none;
        color: var(--faint);
      }
      .options {
        position: absolute;
        z-index: 10;
        top: calc(100% + 4px);
        left: 0;
        width: min(520px, 90vw);
        max-height: min(60vh, 460px);
        margin: 0;
        padding: 4px;
        overflow-y: auto;
        list-style: none;
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.25);
      }
      .options li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
      }
      .options li:hover,
      .options li[aria-selected="true"] {
        background: color-mix(in srgb, var(--ink) 6%, transparent);
      }
      .options .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .options .meta {
        grid-column: 1;
        font-size: 11px;
        color: var(--faint);
      }
      .options .mark {
        grid-row: 1 / 3;
        grid-column: 2;
        align-self: center;
        font-size: 11px;
        color: var(--faint);
      }
      .options .mark[data-yes] {
        color: var(--good);
      }
      .options .none {
        padding: 12px 10px;
        font-size: 12px;
        color: var(--soft);
        cursor: default;
      }
      button {
        height: 30px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--faint);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      main {
        display: grid;
        grid-template-columns: minmax(340px, 440px) 1fr;
        min-height: 0;
      }
      /* ---- 左边：一拍一拍的讲稿 ---- */
      .beats {
        overflow-y: auto;
        border-right: 1px solid var(--rule);
        background: var(--panel);
      }
      .empty {
        padding: 40px 24px;
        font-size: 13px;
        line-height: 1.8;
        color: var(--soft);
      }
      .beat {
        display: grid;
        grid-template-columns: 62px 1fr auto;
        gap: 4px 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule);
        font-size: 13px;
      }
      .beat[data-now] {
        background: color-mix(in srgb, var(--accent) 7%, transparent);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .beat .where {
        font-size: 11px;
        color: var(--faint);
        padding-top: 2px;
      }
      .beat .text {
        line-height: 1.65;
      }
      .beat .text[data-silent] {
        color: var(--faint);
      }
      .beat .title {
        grid-column: 2 / 4;
        font-size: 11px;
        color: var(--faint);
      }
      .beat .side {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--soft);
        white-space: nowrap;
      }
      .beat .side button {
        height: 22px;
        padding: 0 7px;
        font-size: 11px;
      }
      .beat .status {
        grid-column: 2 / 4;
        font-size: 11px;
        color: var(--accent);
      }
      .beat .status[data-ok] {
        color: var(--good);
      }
      /* ---- 右边：带声音和字幕的预览 ---- */
      .preview {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
        padding: 18px;
      }
      /* 画面：16:9。字幕压在底部那一条上——演示用 captions=space 把这一条空出来了 */
      .stage {
        position: relative;
        align-self: center;
        width: min(100%, calc((100vh - 190px) * 16 / 9));
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 8px;
        background: #ebe6da;
        box-shadow: 0 0 0 1px var(--rule);
        container-type: inline-size;
      }
      .stage iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .stage .hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 13px;
        color: var(--soft);
      }
      .subtitle {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4.4%;
        width: fit-content;
        max-width: 82%;
        margin: 0 auto;
        border-radius: 0.6cqw;
        padding: 0.8cqw 1.7cqw;
        background: rgba(41, 36, 30, 0.86);
        color: #f6f1e6;
        font-size: 1.9cqw;
        line-height: 1.5;
        text-align: center;
        pointer-events: none;
      }
      .subtitle:empty {
        display: none;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .controls .spacer {
        flex: 1;
      }
      .summary {
        font-size: 12px;
        line-height: 1.7;
        color: var(--soft);
      }
      .notice {
        border-radius: 6px;
        padding: 8px 12px;
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        font-size: 12px;
        line-height: 1.7;
        color: var(--accent);
      }
      .notice:empty {
        display: none;
      }
      /* 窗口窄的时候上下排：画面在上，讲稿在下 */
      @media (max-width: 980px) {
        body {
          height: auto;
          min-height: 100vh;
        }
        /* 清单按整个标题栏的宽度铺开，不伸到窗口外面去 */
        header {
          position: relative;
          flex-wrap: wrap;
        }
        .picker {
          position: static;
          flex: 1;
          min-width: 0;
        }
        .pick {
          width: 100%;
        }
        /* 站点和配音服务那行小字另起一行，把这一行让给下拉 */
        header .site {
          flex-basis: 100%;
        }
        .options {
          top: 46px;
          left: 12px;
          right: 12px;
          width: auto;
        }
        header h1 {
          white-space: nowrap;
        }
        main {
          grid-template-columns: 1fr;
        }
        /* 画面留在顶上：往下翻讲稿时还看得到 */
        .preview {
          order: -1;
          position: sticky;
          top: 0;
          z-index: 2;
          background: var(--bg);
          border-bottom: 1px solid var(--rule);
        }
        .stage {
          width: min(100%, calc(52vh * 16 / 9));
        }
        .summary {
          display: none;
        }
        .beats {
          overflow: visible;
          border-right: 0;
          border-top: 1px solid var(--rule);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Galley 视频工坊</h1>
      <div id="picker" class="picker">
        <button id="pick" type="button" class="pick" aria-haspopup="listbox" aria-expanded="false">
          <span id="picked">正在读取文章…</span>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <ul id="options" class="options" role="listbox" hidden></ul>
      </div>
      <button id="load" title="文章改过讲稿以后，重新读一遍">重新读取</button>
      <span id="site" class="site"></span>
    </header>
    <main>
      <section id="beats" class="beats">
        <p class="empty">在上面选一篇文章。<br />讲稿按播放的顺序一拍一拍列在这里：每一页的 <code>:::notes</code>、场景每一步的 <code>say</code>。</p>
      </section>
      <section class="preview">
        <div id="stage" class="stage">
          <p id="hint" class="hint">选一篇文章、生成配音之后，点「预览」。</p>
          <iframe id="frame" title="演示" allow="autoplay; fullscreen" hidden></iframe>
          <p id="subtitle" class="subtitle"></p>
        </div>
        <div class="controls">
          <button id="voice" class="primary" disabled>生成配音</button>
          <button id="play" disabled>预览</button>
          <button id="stop" disabled>停止</button>
          <span class="spacer"></span>
          <button id="record" disabled title="把预览连同声音、字幕录成一个视频文件">录制成片</button>
          <button id="srt" disabled title="整段视频的字幕文件">导出字幕</button>
          <button id="unload" title="配音模型占大约 10GB 内存，不用时可以先卸掉">释放模型内存</button>
        </div>
        <p id="notice" class="notice"></p>
        <p id="summary" class="summary"></p>
      </section>
    </main>

    <script>
      /**
       * 流程：
       * 1. 向本地服务要讲稿清单（它带着密钥去问 Galley）；
       * 2. 一拍一拍让本地服务调配音的 MCP 生成声音；
       * 3. 预览：把每一拍的时长拼进演示页的网址（timing），演示嵌在 iframe 里自动播放。
       *    演示每开始一拍就通知一声（postMessage），这里收到后放这一拍的声音、按字幕的时间出字。
       *    所以声音跟的是画面实际走到的位置，不是事先算好的时间。
       */
      const $ = (id) => document.getElementById(id);
      /** 一句话说完到下一拍开始之间的停顿（毫秒） */
      const GAP_MS = 350;

      let config = null;
      let articles = []; // 可以选的文章
      let slug = ""; // 选中的那一篇
      let data = null; // 讲稿清单
      const voices = {}; // 拍的名字 -> { audio, durationMs, cues }
      const players = {}; // 拍的名字 -> 预先加载好的 Audio
      let current = null; // 预览时正在放的那一拍 { id, audio, at }
      let previewing = false;
      let generating = false;
      let recorder = null;

      const say = (text) => ($("notice").textContent = text || "");
      const seconds = (ms) => (ms / 1000).toFixed(1) + " 秒";
      const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.round((ms % 60000) / 1000)).padStart(2, "0")}`;

      /** 这一拍在视频里占多久：有配音的按声音的长短（加一点停顿），没有的按 Galley 建议的；都不能比动画短 */
      const lengthOf = (beat) => Math.max(beat.minMs, voices[beat.id] ? voices[beat.id].durationMs + GAP_MS : beat.suggestedMs);

      const whereOf = (beat) => {
        if (beat.kind === "cover") return "封面";
        if (beat.kind === "ending") return "结尾";
        if (beat.kind === "page") return `第 ${beat.page} 页`;
        return `　步骤 ${Number(beat.id.split(".").pop()) + 1}`;
      };

      function remember(voice) {
        voices[voice.id] = voice;
        const audio = new Audio(voice.audio);
        audio.preload = "auto";
        players[voice.id] = audio;
      }

      /* ---------- 讲稿列表 ---------- */
      function render() {
        const list = $("beats");
        list.textContent = "";
        for (const beat of data.beats) {
          const row = document.createElement("div");
          row.className = "beat";
          row.dataset.id = beat.id;

          const where = document.createElement("span");
          where.className = "where";
          where.textContent = whereOf(beat);

          const text = document.createElement("span");
          text.className = "text";
          if (beat.text) text.textContent = beat.text;
          else {
            text.dataset.silent = "true";
            text.textContent = beat.kind === "step" ? `没有讲稿（画面下面写的是：${beat.written}）` : beat.selfPaced ? "没有讲稿 · 这一页里的播放器自己走节奏" : "没有讲稿";
          }

          const side = document.createElement("span");
          side.className = "side";
          const length = document.createElement("span");
          length.className = "length";
          side.append(length);
          if (beat.text) {
            const listen = document.createElement("button");
            listen.textContent = "试听";
            listen.className = "listen";
            listen.onclick = () => players[beat.id]?.play();
            side.append(listen);
          }

          row.append(where, text, side);
          if (beat.kind === "page" && (beat.title || beat.section)) {
            const title = document.createElement("span");
            title.className = "title";
            title.textContent = [beat.section, beat.title].filter(Boolean).join(" · ");
            row.append(title);
          }
          const status = document.createElement("span");
          status.className = "status";
          row.append(status);
          list.append(row);
        }
        refresh();
      }

      const rowOf = (id) => $("beats").querySelector(`.beat[data-id="${CSS.escape(id)}"]`);

      /** 让这一行出现在讲稿列表里看得见的地方。只滚列表自己：窗口窄、列表排在画面下面时不滚，免得把画面顶出去 */
      function reveal(row) {
        const list = $("beats");
        if (!row || getComputedStyle(list).overflowY !== "auto") return;
        const top = row.offsetTop - list.offsetTop;
        if (top < list.scrollTop || top + row.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTo({ top: top - list.clientHeight / 3, behavior: "smooth" });
      }

      function setStatus(id, text, ok) {
        const el = rowOf(id)?.querySelector(".status");
        if (!el) return;
        el.textContent = text;
        if (ok) el.dataset.ok = "true";
        else delete el.dataset.ok;
      }

      /** 每一行的时长、按钮能不能点、下面那行总结 */
      function refresh() {
        if (!data) return;
        const spoken = data.beats.filter((b) => b.text);
        const done = spoken.filter((b) => voices[b.id]);
        for (const beat of data.beats) {
          const row = rowOf(beat.id);
          row.querySelector(".length").textContent = seconds(lengthOf(beat));
          const listen = row.querySelector(".listen");
          if (listen) listen.disabled = !voices[beat.id];
        }
        const total = data.beats.reduce((sum, b) => sum + lengthOf(b), 0);
        const selfPaced = data.beats.some((b) => b.selfPaced);
        $("summary").textContent =
          `《${data.title}》共 ${data.beats.length} 拍，其中 ${spoken.length} 拍有讲稿，已经配音 ${done.length} 拍。` +
          `按现在的时长，视频大约 ${clock(total)}${selfPaced ? "（有的页里的播放器自己走节奏，实际会再长一些）" : ""}。` +
          `音频存在 ${config.dir}/${data.slug}。`;
        $("voice").disabled = generating || done.length === spoken.length;
        $("voice").textContent = generating ? "正在生成…" : spoken.length === 0 ? "这篇没写讲稿" : done.length === spoken.length ? "配音已齐" : `生成配音（还差 ${spoken.length - done.length} 拍）`;
        $("play").disabled = previewing;
        $("stop").disabled = !previewing;
        $("record").disabled = previewing || !!recorder;
        $("srt").disabled = done.length === 0;
      }

      /* ---------- 选文章 ---------- */
      function renderOptions() {
        const list = $("options");
        list.textContent = "";
        if (!articles.length) {
          const none = document.createElement("li");
          none.className = "none";
          none.textContent = "站点上还没有已发布的文章。";
          list.append(none);
          return;
        }
        for (const article of articles) {
          const item = document.createElement("li");
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", String(article.slug === slug));
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = article.title;
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = [article.publishedAt ? new Date(article.publishedAt).toLocaleDateString("zh-CN") : "", article.slug].filter(Boolean).join(" · ");
          const mark = document.createElement("span");
          mark.className = "mark";
          if (article.narrated) mark.dataset.yes = "true";
          mark.textContent = article.narrated ? `讲稿 ${article.narrated} 处` : "没写讲稿";
          item.append(name, meta, mark);
          item.onclick = () => choose(article.slug);
          list.append(item);
        }
      }

      function toggleOptions(open) {
        $("options").hidden = !open;
        $("pick").setAttribute("aria-expanded", String(open));
        if (open) $("options").querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
      }

      function choose(next) {
        slug = next;
        $("picked").textContent = articles.find((a) => a.slug === slug)?.title ?? "选一篇文章";
        toggleOptions(false);
        renderOptions();
        load();
      }

      async function loadArticles() {
        try {
          const reply = await fetch("/api/articles");
          const body = await reply.json();
          if (!reply.ok) {
            $("picked").textContent = "读不到文章";
            return say(body.error || "读不到文章的清单。");
          }
          articles = body.articles;
          renderOptions();
          // 上次选的那一篇还在：接着用
          const last = localStorage.getItem("studio-slug");
          if (articles.some((a) => a.slug === last)) choose(last);
          else $("picked").textContent = "选一篇文章";
        } catch (e) {
          $("picked").textContent = "读不到文章";
          say(`读不到文章的清单：${e.message}`);
        }
      }

      async function load() {
        if (!slug) return say("先选一篇文章。");
        say("");
        $("load").disabled = true;
        try {
          const reply = await fetch("/api/narration", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug }) });
          const body = await reply.json();
          if (!reply.ok) return say(body.error || "读取失败。");
          localStorage.setItem("studio-slug", slug);
          stop();
          for (const key of Object.keys(voices)) delete voices[key];
          data = body;
          for (const voice of body.voices) remember(voice);
          render();
        } catch (e) {
          say(`读取失败：${e.message}`);
        } finally {
          $("load").disabled = false;
        }
      }

      /* ---------- 配音 ---------- */
      async function generateAll() {
        if (generating || !data) return;
        generating = true;
        say("");
        refresh();
        for (const beat of data.beats) {
          if (!beat.text || voices[beat.id]) continue;
          setStatus(beat.id, "排队中…");
        }
        for (const beat of data.beats) {
          if (!beat.text || voices[beat.id]) continue;
          reveal(rowOf(beat.id));
          setStatus(beat.id, "开始生成…");
          try {
            const reply = await fetch("/api/voice", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project: data.slug, id: beat.id, text: beat.text }) });
            // 服务边生成边一行一行地回：进度……最后一行是结果
            const reader = reply.body.pipeThrough(new TextDecoderStream()).getReader();
            let buffer = "";
            let failed = null;
            for (;;) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += value;
              const lines = buffer.split("\n");
              buffer = lines.pop();
              for (const line of lines.filter(Boolean)) {
                const message = JSON.parse(line);
                if (message.progress) setStatus(beat.id, message.progress);
                if (message.error) failed = message.error;
                if (message.voice) {
                  remember(message.voice);
                  setStatus(beat.id, `配好了，${seconds(message.voice.durationMs)}`, true);
                }
              }
            }
            if (failed) {
              setStatus(beat.id, `没有生成：${failed}`);
              say(`配音停在了「${whereOf(beat).trim()}」：${failed}`);
              break;
            }
          } catch (e) {
            setStatus(beat.id, `没有生成：${e.message}`);
            say(`配音中断了：${e.message}`);
            break;
          }
          refresh();
        }
        generating = false;
        refresh();
        // 预览是按开始那一刻的时长排的：中途配好的声音会照放，但画面停多久还是旧的
        if (previewing) say("配音都好了。正在放的这一轮是按之前的时长排的，点「停止」再「预览」，画面才会按新的声音走。");
      }

      /* ---------- 预览 ---------- */
      function silence() {
        if (current?.audio) {
          current.audio.pause();
          current.audio.currentTime = 0;
        }
        current = null;
        $("subtitle").textContent = "";
      }

      function stop() {
        silence();
        previewing = false;
        $("frame").hidden = true;
        $("frame").removeAttribute("src");
        $("hint").hidden = false;
        $("beats").querySelector("[data-now]")?.removeAttribute("data-now");
        if (recorder && recorder.state !== "inactive") recorder.stop();
        refresh();
      }

      function play() {
        if (!data) return;
        silence();
        previewing = true;
        const timing = data.beats.map((b) => `${b.id}:${lengthOf(b)}`).join(",");
        // auto=1 自动播放；captions=space 不显示 Galley 自己的字幕，但把底部那一条空出来给这里的字幕
        $("frame").src = `${data.galley}${data.present}?auto=1&captions=space&timing=${encodeURIComponent(timing)}`;
        $("frame").hidden = false;
        $("hint").hidden = true;
        refresh();
      }

      /** 演示走到了一拍：放这一拍的声音 */
      function onBeat(id) {
        if (!previewing) return;
        // 同一拍连着通知两次（页面刚打开时会）：不要把声音掐掉重放
        if (current?.id === id && performance.now() - current.at < 400) return;
        silence();
        $("beats").querySelector("[data-now]")?.removeAttribute("data-now");
        const row = rowOf(id);
        if (row) {
          row.dataset.now = "true";
          reveal(row);
        }
        const audio = players[id];
        current = { id, audio, at: performance.now() };
        if (audio) audio.play().catch(() => say("浏览器没让声音自动播放：再点一次「预览」。"));
      }

      /** 按声音放到的位置出字幕 */
      function tick() {
        if (current?.audio && voices[current.id]) {
          const t = current.audio.currentTime;
          const cue = current.audio.paused ? null : voices[current.id].cues.find((c) => t >= c.start && t < c.end + 0.15);
          const text = cue ? cue.text : "";
          if ($("subtitle").textContent !== text) $("subtitle").textContent = text;
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener("message", (e) => {
        if (e.source !== $("frame").contentWindow || e.data?.source !== "galley-present") return;
        if (e.data.type === "beat") onBeat(e.data.id);
        if (e.data.type === "done") {
          const wasRecording = !!recorder;
          // 留一点尾巴再收
          setTimeout(() => {
            if (wasRecording && recorder && recorder.state !== "inactive") recorder.stop();
            else if (previewing) say("播完了。");
          }, 500);
        }
      });

      /* ---------- 导出 ---------- */
      const srtTime = (s) => {
        const ms = Math.round(s * 1000);
        const pad = (n, w = 2) => String(n).padStart(w, "0");
        return `${pad(Math.floor(ms / 3600000))}:${pad(Math.floor(ms / 60000) % 60)}:${pad(Math.floor(ms / 1000) % 60)},${pad(ms % 1000, 3)}`;
      };

      function save(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }

      /** 整段视频的字幕：每一拍的字幕挪到这一拍在视频里开始的位置 */
      function exportSrt() {
        let start = 0;
        let n = 0;
        const out = [];
        for (const beat of data.beats) {
          for (const cue of voices[beat.id]?.cues ?? []) out.push(`${++n}\n${srtTime(start / 1000 + cue.start)} --> ${srtTime(start / 1000 + cue.end)}\n${cue.text}\n`);
          start += lengthOf(beat);
        }
        save(new Blob([out.join("\n")], { type: "text/plain;charset=utf-8" }), `${data.slug}.srt`);
        if (data.beats.some((b) => b.selfPaced)) say("这篇里有自己走节奏的播放器，那几页之后的字幕时间会偏。要准的话用「录制成片」，字幕直接录进画面里。");
      }

      /** 把预览录下来：画面（只录演示那一块，连同字幕）加这个标签页的声音 */
      async function record() {
        if (!data || recorder) return;
        say("");
        let stream;
        try {
          stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30, max: 60 } }, audio: true, preferCurrentTab: true, selfBrowserSurface: "include", surfaceSwitching: "exclude" });
        } catch {
          return say("没有得到录制的权限。点「录制成片」后，在弹出的窗口里选「这个标签页」，勾上「同时分享标签页中的音频」，再点共享。");
        }
        const [video] = stream.getVideoTracks();
        if (window.CropTarget && video.cropTo) {
          try {
            await video.cropTo(await CropTarget.fromElement($("stage")));
          } catch {
            say("这次选的不是当前标签页，会录下整个画面。");
          }
        }
        if (!stream.getAudioTracks().length) say("这次没有录到声音：共享时要勾上「同时分享标签页中的音频」。");
        const mime = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
        const chunks = [];
        recorder = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: 12_000_000, audioBitsPerSecond: 160_000 });
        recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        recorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          save(new Blob(chunks, { type: mime || "video/webm" }), `${data.slug}.${mime.startsWith("video/mp4") ? "mp4" : "webm"}`);
          recorder = null;
          stop();
          say("录好了，视频已经下载。");
        };
        video.addEventListener("ended", () => recorder && recorder.state !== "inactive" && recorder.stop());
        recorder.start(1000);
        play();
      }

      /* ---------- 开始 ---------- */
      $("load").onclick = load;
      $("pick").onclick = () => toggleOptions($("options").hidden);
      document.addEventListener("click", (e) => !$("picker").contains(e.target) && toggleOptions(false));
      document.addEventListener("keydown", (e) => e.key === "Escape" && toggleOptions(false));
      $("voice").onclick = generateAll;
      $("play").onclick = play;
      $("stop").onclick = stop;
      $("srt").onclick = exportSrt;
      $("record").onclick = record;
      $("unload").onclick = async () => {
        const reply = await (await fetch("/api/unload", { method: "POST" })).json();
        say(reply.unloaded ? "配音模型已经卸载，内存还回去了。下次生成会自动重新加载。" : "配音服务还没启动，没有占内存。");
      };

      (async () => {
        config = await (await fetch("/api/config")).json();
        $("site").textContent = `站点：${config.galley}　配音：${config.ttsServer}`;
        const problems = [];
        if (!config.hasToken) problems.push("还没有接入密钥：在 Galley 后台的「MCP 管理」里建一个，启动这个工具时用 GALLEY_TOKEN 或 GALLEY_TOKEN_FILE 给出。");
        if (!config.ttsFound) problems.push(`没有找到配音服务「${config.ttsServer}」：在 ~/.claude.json 的 mcpServers 里登记它，或者用 STUDIO_TTS_COMMAND 给出启动命令。`);
        say(problems.join(" "));
        requestAnimationFrame(tick);
        if (config.hasToken) loadArticles();
        else $("picked").textContent = "还没有接入密钥";
      })();
    </script>
  </body>
</html>
