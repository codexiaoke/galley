name: galley-3d-lab
services:
  studio:
    build:
      context: .
      dockerfile: integrations/video-studio/Dockerfile
    image: galley-3d-lab:local
    init: true
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4431:4431"
    environment:
      STUDIO_PORT: 4431
      GALLEY_URL: http://localhost:3431
      STUDIO_TTS_SERVER: lab-system-voice
    volumes:
      - studio-data:/data
volumes:
  studio-data:
